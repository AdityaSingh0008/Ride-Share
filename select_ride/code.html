<body class="bg-background text-on-surface h-screen w-full flex flex-col overflow-hidden select-none antialiased relative">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent flex justify-between items-center px-margin-mobile py-md w-full">
<button class="flex items-center justify-center p-sm rounded-full bg-surface-container/80 backdrop-blur-sm text-primary hover:bg-surface-variant/20 transition-colors duration-200">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary text-center flex-1 drop-shadow-md">RideShare</h1>

</div>
</header>

<svg class="w-full h-full opacity-60" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M 20 80 Q 40 40 80 20" fill="none" stroke="#2e5bff" stroke-linecap="round" stroke-width="0.8" style="filter: drop-shadow(0 0 4px #2e5bff);"></path>
<!-- Pickup -->
<circle cx="20" cy="80" fill="#ffffff" r="1.5" stroke="#2e5bff" stroke-width="0.5"></circle>
<circle cx="20" cy="80" fill="#2e5bff" r="0.5"></circle>
<!-- Dropoff -->
<path d="M 80 20 L 78.5 16 L 81.5 16 Z" fill="#2e5bff"></path>
</svg>
</div>
</main>
<!-- Bottom Sheet (Ride Selection) -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-3xl shadow-[0px_-8px_24px_rgba(0,0,0,0.5)] flex flex-col z-40 transition-transform duration-300 ease-in-out pb-4">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-sm cursor-grab active:cursor-grabbing">
<div class="w-12 h-1 bg-on-surface-variant/50 rounded-full"></div>
</div>
<div class="px-margin-mobile flex flex-col gap-sm overflow-y-auto max-h-[60vh] pb-24">
<h2 class="font-title-md text-title-md text-on-surface mb-sm">Choose a ride</h2>
<!-- Ride Option 1: Economy -->

</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">3 min away • 12:45 PM</span>
</div>
</div>
<div class="font-title-md text-title-md text-on-surface font-bold">
                    $12.50

</div>

<div class="absolute inset-0 bg-primary-container/5 pointer-events-none"></div>
<div class="flex items-center gap-md relative z-10">
<img alt="Comfort car" class="w-16 h-12 object-contain drop-shadow-lg" data-alt="A minimalist, side-view 3D illustration of a mid-size SUV in metallic dark grey. The rendering is sleek, set against a dark background with a soft, ambient electric blue underglow. Premium, clean aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBh-yHI3TQbkVQx4BFSB6iX8UYkNyBpdf85EPBQx9E0PSrHOEOGkwjSVUTYbrvKPoVLsRHlZIBP0LPboEfcaWBpUtqP9k9mlnC_rPZATYxuq7bd07cK9OoOFtisyrNL9sRliPpheo_rf-f5TMrTpGXxQPbAs3bjY5eSD1vK4fwRVcGxYwiOB2AgZbemT9SQDVHviRmPP4_vjicnW4bcHSVjoVhbe1L35sle5njZVGN7Mu7bCBgnLyuP"/>
<div class="flex flex-col">

</div>

</div>
</div>
<div class="font-title-md text-title-md text-on-surface font-bold">
                    $25.00

</div>
<div class="flex items-center justify-between px-xs py-sm border-t border-outline-variant/30 mt-sm">
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
<span class="font-body-sm text-body-sm">•••• 4242</span>
</div>
<button class="font-label-bold text-label-bold text-primary hover:text-primary-fixed transition-colors">Change</button>
</div>
</div>

<div class="absolute bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent pt-xl pb-6">
