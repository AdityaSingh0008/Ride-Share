            background-size: 20px 20px;

            box-shadow: 0 0 20px rgba(46, 91, 255, 0.3);

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent flex justify-between items-center px-margin-mobile py-md">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/50 backdrop-blur-md shadow-lg border border-outline-variant hover:bg-surface-variant/20 transition-colors duration-200">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">RideShare</h1>
<button class="w-12 h-12 rounded-full overflow-hidden border border-outline-variant shadow-lg hover:bg-surface-variant/20 transition-colors duration-200">
<img alt="User profile photo" class="object-cover w-full h-full" data-alt="A close-up portrait of a user profile photo. The lighting is moody and cinematic with soft electric blue accents reflecting off the subject's face against a dark obsidian background, aligning with the RideShare premium dark mode UI aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBnMylpzLuWgHbrJW_XOPctNBDasPlY7Eg0BjR2_tnNo-AqoO5xliee7VVS_AzyASS2MjEwRdAF1Ms6ffWHqa51GZhilLYqU2uQR4hbNweJXmvs5lBTOe6vDrMFUpl5UKM5oRIPYeVHPVm88QAZhXyllm5rkNFeJc_wIM57INBlFSfYjiXBR0Oj9iZpT3xfGFVGcHD8RymRLW45iUVb2PMG88O-DnyctlZBfmisO9MppscXNNpxxYAz"/>

</header>

<div class="relative flex items-center justify-center">
<div class="absolute w-24 h-24 bg-primary/20 rounded-full animate-ping"></div>
<div class="w-6 h-6 bg-white rounded-full flex items-center justify-center shadow-lg relative z-10">
<div class="w-3 h-3 bg-primary-container rounded-full glow-effect"></div>
</div>
</div>
<!-- Random Map Cars -->
<span class="material-symbols-outlined absolute top-1/4 left-1/4 text-on-surface-variant/70 rotate-45" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<span class="material-symbols-outlined absolute top-2/3 right-1/3 text-on-surface-variant/70 -rotate-12" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<span class="material-symbols-outlined absolute bottom-1/4 left-1/2 text-on-surface-variant/70 rotate-90" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>

<div class="absolute bottom-0 w-full z-40 px-margin-mobile pb-24 md:pb-margin-mobile">
<div class="bg-surface w-full rounded-xl shadow-[0px_-8px_24px_rgba(0,0,0,0.5)] border border-outline-variant flex flex-col items-center">

<div class="w-full px-lg py-md pb-lg">

<span class="material-symbols-outlined absolute left-sm text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-lg text-body-lg py-md pl-xl pr-lg focus:ring-0 placeholder:text-on-surface-variant/50" placeholder="Enter destination" type="text"/>

<span class="material-symbols-outlined text-primary text-sm" data-icon="home">home</span>
<span class="font-body-sm text-body-sm text-on-surface">Home</span>

<span class="material-symbols-outlined" data-icon="history">history</span>

</button>

<span class="material-symbols-outlined" data-icon="person">person</span>
