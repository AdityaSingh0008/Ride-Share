<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Tracking - RideShare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#8e90a2",
                        "on-error": "#690005",
                        "surface": "#121414",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#001356",
                        "on-background": "#e2e2e2",
                        "inverse-primary": "#124af0",
                        "surface-container-low": "#1a1c1c",
                        "primary-container": "#2e5bff",
                        "primary": "#b8c3ff",
                        "on-primary-fixed-variant": "#0035be",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-primary-container": "#efefff",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary": "#c8c6c5",
                        "surface-container": "#1e2020",
                        "on-secondary-container": "#bab8b7",
                        "on-primary": "#002388",
                        "surface-dim": "#121414",
                        "outline-variant": "#434656",
                        "inverse-on-surface": "#2f3131",
                        "secondary-container": "#4a4949",
                        "primary-fixed": "#dde1ff",
                        "on-secondary": "#313030",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474646",
                        "on-tertiary-container": "#f3f0ef",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-tertiary-fixed": "#1b1b1c",
                        "on-surface": "#e2e2e2",
                        "surface-bright": "#37393a",
                        "surface-variant": "#333535",
                        "surface-container-high": "#282a2b",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-tint": "#b8c3ff",
                        "secondary": "#c8c6c5",
                        "tertiary-container": "#6e6d6d",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c4c5d9",
                        "surface-container-highest": "#333535",
                        "on-tertiary": "#303030",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#e5e2e1",
                        "primary-fixed-dim": "#b8c3ff",
                        "background": "#121414",
                        "surface-container-lowest": "#0c0f0f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "bottom-sheet-peak": "280px",
                        "unit": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "gutter": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "title-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-transparent flex justify-between items-center px-margin-mobile py-md">
<button aria-label="Menu" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low shadow-sm border border-outline-variant/30 text-primary transition-colors duration-200 hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">RideShare</h1>
<div class="w-12 h-12 rounded-full overflow-hidden border border-outline-variant/30">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A detailed headshot of a person looking directly at the camera. The background is slightly blurred and features a futuristic neon city street at night. The person is wearing minimalist, high-end technical clothing. Lighting is dramatic, with electric blue rim light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbcyVhVjSidFNDhyQJBAJ7jcw5HAD6yDnNTygepQL_0271tkJ5LGMgtpV7po6xLZJd9rLtzMRi6uHRNgYdB7cLuU--CKMz96WM3LB4Tu9Jn_RniERjeY9hK-hBU1UXkOn8_ZjiW_LWcdmxvibE5DQ97BafE3unAV24U-utMYi6oSpxFALvz-Weec_8PvWI-8zD7wCUEDdVR5VzxmdR_FZF0xU2eHpXut5H_3yDp5_Q3Ic1_XxgWKtT"/>
</div>
</header>
<!-- Map Background Area -->
<div class="flex-grow relative z-0">
<!-- Pseudo-map placeholder image -->
<img alt="Map view" class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-screen" data-alt="A dark mode satellite view map of a dense urban city at night. The map features minimal labels, dark obsidian gray water and terrain, and neon glowing electric blue lines indicating a route. The aesthetic is extremely high-tech, like a premium digital cockpit dashboard." data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlZgALPmrYyMB3vXlfL4kuQBmkfaLdTwsZ1jGMLSj4QIL4jr4Sr3EalqOo6XGXkxa0-6z42xpvBlhed2NbhV9_6yxKWjVosL5zZ6BoQle5m-_6EIkdl8PR8ID_Sqxijpeo-7-kJNV-5Eja-VI4dpfECBv_iySA0eilp3DKhvD1fpMNq3WUPLL4hL1Oix6YI_wz4K185fothLE7j49Y4FIpwtLWPX8xt6clUnqaYI8Aw2MicWxSmE-I"/>
<!-- Gradient overlay to fade map into background at the top and bottom -->
<div class="absolute inset-0 bg-gradient-to-b from-background/90 via-transparent to-background/90 pointer-events-none"></div>
<!-- Simulated Map Elements -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<!-- Route Line Simulation -->
<svg class="absolute inset-0 w-full h-full" preserveaspectratio="none" viewbox="0 0 400 800">
<path d="M 200 600 C 150 500, 250 400, 200 300" fill="none" filter="drop-shadow(0px 0px 8px rgba(184, 195, 255, 0.5))" stroke="#b8c3ff" stroke-linecap="round" stroke-width="4"></path>
</svg>
<!-- Destination Marker -->
<div class="absolute top-[37.5%] left-[50%] -translate-x-1/2 -translate-y-full flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[32px] filter drop-shadow-[0_0_8px_rgba(184,195,255,0.8)]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- Moving Car Indicator -->
<div class="absolute bottom-[25%] left-[50%] -translate-x-1/2 -translate-y-1/2 flex items-center justify-center w-12 h-12 bg-primary-container/20 rounded-full animate-pulse">
<div class="w-8 h-8 bg-surface rounded-full flex items-center justify-center shadow-[0_0_12px_rgba(46,91,255,0.8)] border border-primary">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
</div>
</div>
</div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 w-full z-40 bg-surface rounded-t-xl shadow-[0px_-8px_24px_rgba(0,0,0,0.5)] border-t border-outline-variant/50 pt-sm pb-lg px-margin-mobile flex flex-col gap-md transition-transform duration-300 transform translate-y-0">
<!-- Grab Handle -->
<div class="w-10 h-1 bg-on-surface/50 rounded-full mx-auto mb-xs"></div>
<!-- Status Header -->
<div class="flex items-center justify-between">
<h2 class="font-title-md text-title-md text-on-surface">Arriving in 4 min</h2>
<div class="bg-primary-container/20 px-3 py-1 rounded-full border border-primary-container/50">
<span class="font-label-bold text-label-bold text-primary">ON TIME</span>
</div>
</div>
<!-- Driver & Vehicle Details Card -->
<div class="bg-surface-container border border-outline-variant/30 rounded-lg p-md flex items-center gap-md">
<!-- Driver Avatar -->
<div class="w-14 h-14 rounded-full overflow-hidden border border-outline-variant/50 flex-shrink-0 relative">
<img alt="Driver photo" class="w-full h-full object-cover" data-alt="A close-up profile portrait of a friendly professional driver in a dark, high-end vehicle interior. Soft neon blue lighting highlights their face. They are looking confidently at the camera. Minimalist, premium corporate photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVe3fBPHivpxwsW5dnZiAueC9hXsjGKcLeRqyymqhBlLZ2m2Q69C5dTWfGNOHLwp6Hk1q9JhdO5X260VNAQeKewztH-EC0JzKdOJehmZX6PCWZb52G9aoOWrTZF_cL0oI1pIL3h4Ji7k_obKocmWplvm98ExNYy8eq5HA4VPCN8TPC-xjyp6O2Xlxjjx6MZRF_aFDzryEgN_lVczJ9DO8-ErQiAEMPY3qJEnMOM-wXCPoQ4FHwPam0"/>
<div class="absolute bottom-0 right-0 bg-surface w-5 h-5 rounded-full flex items-center justify-center border border-outline-variant">
<span class="font-label-bold text-[8px] font-bold text-primary">4.9</span>
</div>
</div>
<!-- Details -->
<div class="flex flex-col flex-grow">
<span class="font-title-md text-title-md text-on-surface">Alex</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Tesla Model 3 • ABC-1234</span>
</div>
</div>
<!-- Quick Actions -->
<div class="flex gap-md mt-sm">
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-low border border-primary-container text-primary font-label-bold text-label-bold py-3 rounded-lg hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="call">call</span>
                CALL
            </button>
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-low border border-primary-container text-primary font-label-bold text-label-bold py-3 rounded-lg hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="chat">chat</span>
                MESSAGE
            </button>
<button aria-label="More options" class="w-12 flex items-center justify-center bg-surface-container-low border border-outline-variant/30 text-on-surface-variant rounded-lg hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="more_horiz">more_horiz</span>
</button>
</div>
</div>
</body></html>
